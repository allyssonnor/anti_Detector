metadata:
  name: YAML Demo Colab - Banca Examinadora
  role: Demonstrador rápido para Google Colab com treino em baseline e inferência cruzada
settings:
  results_root: results/demo_colab
  cache_root: data/GLOBAL_CACHE_DEMO_COLAB
  seeds: [42]
  save_checkpoints: true
  run_mixed_eval: true
  run_isolated_eval: false

datasets:
- name: Synthetic_Chronological
  overrides:
    sampling.split_strategy: chronological
    features.feature_set: FE-Full

model_presets:
- name: RandomForest
  overrides:
    model.type: random_forest_supervised
    training.supervised: true
    model.random_forest_supervised:
      n_estimators: 100
      max_depth: 8
      class_weight: balanced_subsample
      n_jobs: 1
- name: MLP_Single
  overrides:
    model.type: mlp_single
    training.supervised: false
    model.mlp_single:
      hidden_layer_sizes:
      - 32
      max_iter: 30
      early_stopping: true

hyperparameter_grid:
  training.threshold_mode:
  - global
  model.sequence_length:
  - 20

data:
  dataset_path: data/seed_1_sample.jsonl
  target_col: Is_Anomaly
  time_nan_strategy: nan

sampling:
  mode: full
  split_strategy: chronological
  split_ratios:
    train: 0.7
    val: 0.2
    test: 0.1

training:
  resume: false
  save_model: true
  optimization_metric: f2
  threshold_search:
    percentile_min: 75.0
    percentile_max: 99.5
    percentile_step: 0.5

temporal:
  session_timeout: 1800
  min_events_session: 2
