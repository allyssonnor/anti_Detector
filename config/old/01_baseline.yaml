metadata:
  name: YAML 01 - Baseline
  role: comparacao inicial dos modelos CPU

settings:
  results_root: results/01_baseline
  cache_root: data/GLOBAL_CACHE_DETECTOR   
  seeds: [42, 123, 999]
  save_checkpoints: true
  run_mixed_eval: true
  run_isolated_eval: false

datasets:
- name: Synthetic_Chronological
  overrides:
    sampling.split_strategy: chronological
    features.enabled_groups:
    - auth_failure
    - volume_anomaly
    - temporal_anomaly
    - lateral_movement
    - rdp_anomaly
    - golden_ticket
    - process_anomaly
    - privilege_anomaly

- name: Synthetic_Random
  overrides:
    sampling.split_strategy: random
    features.enabled_groups:
    - auth_failure
    - volume_anomaly
    - temporal_anomaly
    - lateral_movement
    - rdp_anomaly
    - golden_ticket
    - process_anomaly
    - privilege_anomaly

model_presets:
- name: MLP_Single
  overrides:
    model.type: mlp_single
    training.supervised: false
    model.mlp_single:
      hidden_layer_sizes:
      - 64
      - 32
      max_iter: 100

- name: RandomForest
  overrides:
    model.type: random_forest_supervised
    training.supervised: true
    model.random_forest_supervised:
      n_estimators: 150
      max_depth: 8
      class_weight: balanced_subsample
      
hyperparameter_grid:
  training.threshold_mode:
  - global
  - per_user
  model.sequence_length:
  - 20
data:
  dataset_path: /data/seed_1.jsonl
  target_col: Is_Anomaly
  time_nan_strategy: nan
sampling:
  mode: full
  split_ratios:
    train: 0.7
    val: 0.2
    test: 0.1
training:
  resume: true
  save_model: true
temporal:
  session_timeout: 1800
  min_events_session: 2
