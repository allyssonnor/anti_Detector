metadata:
  name: YAML 01 - Baseline_GPU
  role: comparacao inicial dos modelos (GPU)

settings:
  results_root: results/01_baseline_GPU      # <-- mude para não conflitar
  cache_root: data/GLOBAL_CACHE_DETECTOR     # <-- adicione para compartilhar cache
  #seeds: [42, 123, 999]
  seeds: [42]
  save_checkpoints: true
  run_mixed_eval: true
  run_isolated_eval: false

datasets:
