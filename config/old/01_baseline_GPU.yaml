#    - privilege_anomaly
- name: Synthetic_Random
  overrides:
    sampling.split_strategy: random
    features.enabled_groups:
    - auth_failure
    - volume_anomaly
    - temporal_anomaly
    - lateral_movement
    - rdp_anomaly
    - golden_ticket
    - process_anomaly
    - privilege_anomaly

