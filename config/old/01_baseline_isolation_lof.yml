metadata:
  name: YAML 01 - Baseline_LOF
  role: comparacao de modelos profundos e classicos nao supervisionados
settings:
  results_root: results/01_baseline_LOF
  cache_root: data/GLOBAL_CACHE_DETECTOR
  seeds: [42]
  save_checkpoints: true
  run_mixed_eval: true
  run_isolated_eval: false

datasets:
- name: Synthetic_Chronological
  overrides:
    sampling.split_strategy: chronological
    features.enabled_groups:
    - auth_failure
    - volume_anomaly
    - temporal_anomaly
    - lateral_movement
    - rdp_anomaly
    - golden_ticket
    - process_anomaly
    - privilege_anomaly
- name: Synthetic_Random
  overrides:
    sampling.split_strategy: random
    features.enabled_groups:
    - auth_failure
    - volume_anomaly
    - temporal_anomaly
    - lateral_movement
    - rdp_anomaly
    - golden_ticket
    - process_anomaly
    - privilege_anomaly

model_presets:

- name: "LOF CPU"
  overrides:
    model.type: "lof"
    model.lof:
      n_neighbors: 20
      contamination: 0.1

hyperparameter_grid:
  training.threshold_mode:
  - per_user
  - global
  model.sequence_length:
  - 20

data:
  dataset_path: /content/drive/MyDrive/Dados_Detecção/dados de treino/dataset misto/seed_1/seed_1.jsonl
  target_col: Is_Anomaly
  time_nan_strategy: nan

sampling:
  mode: full
  split_ratios:
    train: 0.7
    val: 0.2
    test: 0.1

training:
  resume: true
  save_model: true

temporal:
  session_timeout: 1800
  min_events_session: 2