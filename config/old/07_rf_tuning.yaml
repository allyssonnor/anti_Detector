metadata:
  name: YAML 07 - Tunagem Random Forest
  role: refinamento do melhor RF
settings:
  results_root: results/07_rf_tuning
  cache_root: data/GLOBAL_CACHE_DETECTOR
  seeds:
  - 42
  save_checkpoints: true
  run_mixed_eval: true
  run_isolated_eval: false
datasets:
- name: Synthetic_Random
  overrides:
    sampling.split_strategy: random
    features.enabled_groups:
    - auth_failure
    - volume_anomaly
    - temporal_anomaly
    - lateral_movement
    - rdp_anomaly
    - golden_ticket
    - process_anomaly
    - privilege_anomaly
model_presets:
- name: RandomForest_Tuned
  overrides:
    model.type: random_forest_supervised
    training.supervised: true
hyperparameter_grid:
  training.threshold_mode:
  - per_user
  model.sequence_length:
  - 20
  model.random_forest_supervised.n_estimators:
  - 50
  - 100
  - 200
  model.random_forest_supervised.max_depth:
  - 5
  - 10
  - 20
  - null
data:
  dataset_path: /data/seed_1.jsonl
  target_col: Is_Anomaly
  time_nan_strategy: nan
sampling:
  mode: full
  split_ratios:
    train: 0.7
    val: 0.2
    test: 0.1
training:
  resume: false
  save_model: true
temporal:
  session_timeout: 1800
  min_events_session: 2
