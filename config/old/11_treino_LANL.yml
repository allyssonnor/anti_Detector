metadata:
  name: YAML 11 - Treino em LANL
  role: cross-dataset validation em formato LANL

settings:
  results_root: results/11_lanl
  cache_root: data/GLOBAL_CACHE_LANL
  seeds: [42, 123, 999]
  save_checkpoints: true
  run_mixed_eval: true
  run_isolated_eval: false

datasets:
- name: LANL_Chrono
  overrides:
    data.dataset_path: "/content/drive/MyDrive/Project_Generator/data/CERT e LANL treino/lanl/full/full.csv"
    data.label_filename: gabarito.csv
    data.time_nan_strategy: zero
    sampling.split_strategy: chronological
- name: LANL_Random
  overrides:
    data.dataset_path: "/content/drive/MyDrive/Project_Generator/data/CERT e LANL treino/lanl/full/full.csv"
    data.label_filename: gabarito.csv
    data.time_nan_strategy: zero
    sampling.split_strategy: random

model_presets:
- name: RandomForest
  overrides:
    model.type: random_forest_supervised
    training.supervised: true
    model.random_forest_supervised:
      n_estimators: 200
      max_depth: 10
      class_weight: balanced_subsample
- name: MLP_Single
  overrides:
    model.type: mlp_single
    training.supervised: false
    model.mlp_single:
      hidden_layer_sizes: [256, 128, 64]
      max_iter: 100

hyperparameter_grid:
  training.threshold_mode: [per_user]
  model.sequence_length: [10]

data:
  target_col: Is_Anomaly

sampling:
  mode: full
  split_ratios:
    train: 0.7
    val: 0.2
    test: 0.1

training:
  resume: true
  save_model: true

temporal:
  session_timeout: 1800
  min_events_session: 2