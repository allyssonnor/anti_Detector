metadata:
  name: YAML Smoke Test Debug
  role: smoke test com 1 dataset, 1 seed, 1 preset em modo debug

settings:
  results_root: results
  cache_root: data/GLOBAL_CACHE_SMOKE_TEST
  seeds: [42]
  save_checkpoints: true
  run_mixed_eval: true
  run_isolated_eval: false

datasets:
- name: Synthetic_Chronological
  overrides:
    sampling.split_strategy: chronological
    features.enabled_groups:
    - auth_failure
    - volume_anomaly
    - temporal_anomaly
    - lateral_movement
    - rdp_anomaly
    - golden_ticket
    - process_anomaly
    - privilege_anomaly

model_presets:
- name: MLP_Single
  overrides:
    model.type: mlp_single
    training.supervised: false
    model.mlp_single:
      hidden_layer_sizes:
      - 32
      max_iter: 20

hyperparameter_grid:
  training.threshold_mode:
  - global
  model.sequence_length:
  - 20

data:
  dataset_path: data/seed_1.jsonl
  target_col: Is_Anomaly
  time_nan_strategy: nan

sampling:
  mode: debug
  train_size: 20000
  split_ratios:
    train: 0.6
    val: 0.2
    test: 0.2

training:
  resume: false
  save_model: true
  supervised: false
  optimization_metric: f2
  threshold_search:
    percentile_min: 80.0
    percentile_max: 99.5
    percentile_step: 0.5

temporal:
  session_timeout: 1800
  min_events_session: 2
